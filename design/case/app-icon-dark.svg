<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Tracks app icon — dark</title>
  <defs>
    <linearGradient id="caseFace" x1="0.08" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#535A65"/>
      <stop offset="0.42" stop-color="#3A4049"/>
      <stop offset="1" stop-color="#262B32"/>
    </linearGradient>
    <radialGradient id="caseSheen" cx="0.22" cy="0.1" r="0.72">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="caseSpine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A1E23"/>
      <stop offset="0.35" stop-color="#4E5661"/>
      <stop offset="0.7" stop-color="#343B44"/>
      <stop offset="1" stop-color="#1B1F25"/>
    </linearGradient>
    <linearGradient id="hingePanel" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#171B20"/>
      <stop offset="0.45" stop-color="#2B323A"/>
      <stop offset="1" stop-color="#434B55"/>
    </linearGradient>
    <linearGradient id="hingeGap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8994A3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hingeTab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C636E"/>
      <stop offset="1" stop-color="#333A43"/>
    </linearGradient>

    <linearGradient id="tray" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#171A1F"/>
      <stop offset="0.5" stop-color="#22262C"/>
      <stop offset="1" stop-color="#2F353D"/>
    </linearGradient>
    <linearGradient id="trayTopShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5F6A7B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trayLeftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5F6A7B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trayBottomLight" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trayRightLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>

    <radialGradient id="disc" cx="0.34" cy="0.26" r="0.85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.3" stop-color="#F1F4F8"/>
      <stop offset="0.62" stop-color="#D2D9E3"/>
      <stop offset="0.86" stop-color="#A9B3C0"/>
      <stop offset="1" stop-color="#7E8896"/>
    </radialGradient>
    <linearGradient id="discSweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#E8ECF2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B95A3" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="hole" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#0F1216"/>
      <stop offset="1" stop-color="#191D22"/>
    </radialGradient>

    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
    <clipPath id="trayClip">
      <rect x="170" y="170" width="684" height="684" rx="44"/>
    </clipPath>
    <clipPath id="discClip">
      <circle cx="512" cy="512" r="170"/>
    </clipPath>

    <filter id="iconShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="rainbowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="sweepBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="wedgeBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="tabShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- the squircle is the jewel case itself -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#caseFace)"/>
  </g>

  <g clip-path="url(#squircleClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#caseFace)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#caseSheen)"/>

    <!-- spine / hinge, following the case's rounded left edge -->
    <rect x="100" y="100" width="64" height="824" fill="url(#caseSpine)"/>
    <rect x="108" y="120" width="44" height="784" rx="22" fill="url(#hingePanel)"/>
    <rect x="109.5" y="121.5" width="41" height="781" rx="20.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>
    <rect x="109.5" y="121.5" width="41" height="781" rx="20.5" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="106" y="118" width="48" height="60" rx="24" fill="#000000" opacity="0.22"/>
    <rect x="152" y="120" width="12" height="784" fill="url(#hingeGap)"/>
    <path d="M 163 140 L 163 884" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"/>
    <path d="M 167 145 L 167 879" stroke="#000000" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="166" y="140" width="16" height="744" fill="#000000" opacity="0.25"/>

    <!-- recessed tray -->
    <rect x="170" y="170" width="684" height="684" rx="44" fill="url(#tray)"/>
    <rect x="170" y="170" width="684" height="684" rx="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"/>
    <rect x="172.5" y="172.5" width="679" height="679" rx="41.5" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="1.5"/>

    <g clip-path="url(#trayClip)">
      <rect x="170" y="170" width="684" height="130" fill="url(#trayTopShade)"/>
      <rect x="170" y="170" width="130" height="684" fill="url(#trayLeftShade)"/>
      <rect x="170" y="724" width="684" height="130" fill="url(#trayBottomLight)"/>
      <rect x="614" y="170" width="240" height="684" fill="url(#trayRightLight)"/>

      <!-- the disc is scaled to fill the case; hole stays at 512,512 -->
      <g transform="translate(512 512) scale(1.9647) translate(-512 -512)">
        <circle cx="512" cy="524" r="172" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="16" filter="url(#softBlur)"/>

        <g>
          <circle cx="512" cy="512" r="170" fill="url(#disc)"/>
          <g clip-path="url(#discClip)">
            <g fill="none" stroke-width="1.2">
              <circle cx="512" cy="512" r="92" stroke="#FFFFFF" stroke-opacity="0.16"/>
              <circle cx="512" cy="512" r="116" stroke="#4C5563" stroke-opacity="0.22"/>
              <circle cx="512" cy="512" r="140" stroke="#FFFFFF" stroke-opacity="0.14"/>
              <circle cx="512" cy="512" r="160" stroke="#4C5563" stroke-opacity="0.22"/>
            </g>

            <g fill="none" stroke-width="30" stroke-opacity="0.28" filter="url(#rainbowBlur)" transform="translate(512 512) scale(1.02) translate(-512 -512)">
              <path d="M 512 362 A 150 150 0 0 1 618.07 405.93" stroke="#8FE3FF"/>
              <path d="M 618.07 405.93 A 150 150 0 0 1 662 512" stroke="#B6A6FF"/>
              <path d="M 662 512 A 150 150 0 0 1 618.07 618.07" stroke="#FF9FD4"/>
              <path d="M 618.07 618.07 A 150 150 0 0 1 512 662" stroke="#FFC98F"/>
              <path d="M 512 662 A 150 150 0 0 1 405.93 618.07" stroke="#C6FFB8"/>
              <path d="M 405.93 618.07 A 150 150 0 0 1 362 512" stroke="#8FFFE0"/>
              <path d="M 362 512 A 150 150 0 0 1 405.93 405.93" stroke="#9ED8FF"/>
              <path d="M 405.93 405.93 A 150 150 0 0 1 512 362" stroke="#D3B4FF"/>
            </g>

            <ellipse cx="430" cy="432" rx="250" ry="92" fill="url(#discSweep)" opacity="0.7" transform="rotate(-38 430 432)" filter="url(#sweepBlur)"/>
            <g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="40" stroke-linecap="butt" filter="url(#wedgeBlur)">
              <path d="M 566 557 L 639 619"/>
              <path d="M 458 557 L 385 619"/>
              <path d="M 458 467 L 385 405"/>
              <path d="M 566 467 L 639 405"/>
            </g>

            <circle cx="512" cy="512" r="168.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
            <circle cx="512" cy="512" r="169" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="2"/>
            <circle cx="515" cy="516" r="164" fill="none" stroke="#000000" stroke-opacity="0.38" stroke-width="7" filter="url(#softBlur)"/>
          </g>

          <circle cx="512" cy="512" r="60" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="5"/>
          <circle cx="512" cy="512" r="57" fill="url(#hub)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
          <circle cx="512" cy="512" r="57" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="1.5"/>
          <circle cx="512" cy="512" r="37" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
          <circle cx="512" cy="512" r="39" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="1.5"/>
          <path d="M 462 484 A 57 57 0 0 1 536 459" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.28"/>
          <circle cx="512" cy="512" r="19" fill="url(#hole)"/>
          <circle cx="512" cy="512" r="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
          <path d="M 496 522 A 19 19 0 0 0 528 522" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
        </g>
      </g>
    </g>

    <!-- tray clips -->
    <g fill="#0F1216" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2">
      <path d="M 414 170 A 16 16 0 0 1 446 170 Z"/>
      <path d="M 578 170 A 16 16 0 0 1 610 170 Z"/>
      <path d="M 414 854 A 16 16 0 0 0 446 854 Z"/>
      <path d="M 578 854 A 16 16 0 0 0 610 854 Z"/>
    </g>

    <!-- hinge pins -->
    <g filter="url(#tabShadow)">
      <rect x="116" y="226" width="32" height="14" rx="7" fill="url(#hingeTab)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
      <rect x="116" y="784" width="32" height="14" rx="7" fill="url(#hingeTab)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
    </g>

    <!-- case rim -->
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="2"/>
  </g>
</svg>
